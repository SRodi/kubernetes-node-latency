# Default configuration for node-startup-latency runs.
# Override on the CLI with --provider, --iterations, --region, --run-id.

provider: gke_autopilot   # gke_autopilot | gke_standard_dpv2 | aks_overlay_cilium | aks_byocni | existing
region: europe-west1
cluster_name: node-latency-test
release_channel: regular  # GKE only
kubernetes_version: null  # null = provider default

iterations: 10
per_iteration_timeout_s: 900
node_settle_seconds: 30   # wait this long after pod cleanup before next iteration

trigger_pod:
  namespace: default
  image: registry.k8s.io/pause:3.9
  cpu: "1500m"
  memory: "2Gi"

cni:
  # Override the CNIProbe; null = pick the one paired with the provider.
  probe: null             # cilium_dpv2 | cilium_generic | null
  ready_regex: null       # null = use probe default
  log_tail_lines: 5000
  # Tier-1 deep-Cilium capture (also enabled via --deep-cilium):
  # one-shot scraper Pod per iteration, pinned to the new node, that curls
  # the agent's PodIP:port/metrics. Works on every supported platform
  # (incl. GKE Autopilot — no exec/proxy/hostNetwork required).
  # Adds ~3-5s per iteration.
  deep: false
  metrics_ports: [9962, 9963, 9090]
  deep_scraper_image: curlimages/curl:8.11.1
  deep_scraper_namespace: default

output:
  base_dir: results
  show_plots: false

gke_standard:
  # Trigger pod requests 1500m CPU / 2Gi — e2-medium is too small for CA to
  # find a fit, leaving the pod Pending forever. e2-standard-4 has headroom.
  machine_type: e2-standard-4
  num_nodes: 1
  min_nodes: 0
  max_nodes: 10

aks:
  resource_group: node-latency-rg
  location: null              # null -> falls back to top-level region
  kubernetes_version: null
  node_provisioning: cluster_autoscaler   # cluster_autoscaler | nap | manual
  keep_resource_group: true   # don't delete the RG on cluster delete
  system_node_pool:
    name: systempool
    vm_size: Standard_D4s_v5
    node_count: 1
  user_node_pool:             # the autoscaling pool that hosts trigger pods
    name: latencypool
    vm_size: Standard_D4s_v5
    min_count: 0
    max_count: 50
    node_count: 0
  byocni:
    cilium_chart_version: "1.19.3"
    cilium_repo_url: https://helm.cilium.io/
    cilium_values:
      kubeProxyReplacement: "true"
      operator.replicas: "1"
    install_timeout_s: 600
